name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true


      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install Pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      # Generate EPUB first: bumps the version in _config.yml so the
      # site build and the EPUB share the same version number
      - name: Generate EPUB
        run: ./scripts/generate_epub.sh

      # Build the Jekyll site
      - name: Build with Jekyll
        run: bundle exec jekyll build

        env:
          JEKYLL_ENV: production

      - name: Copy EPUB to site folder
        run: cp assets/japanese-maple.epub _site/assets/

      # Persist the version bump or _config.yml stays stale forever
      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _config.yml
          git diff --cached --quiet && echo "no version change" || (git commit -m "Bump version [skip ci]" && git push)


      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
